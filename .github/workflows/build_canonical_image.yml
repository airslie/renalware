name: Build Canonical Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "documentation/**"

permissions:
  actions: read
  contents: read
  packages: write
  id-token: write

concurrency:
  group: build-canonical-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-26.04
    env:
      IMAGE_NAME: ghcr.io/airslie/renalware

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          VERSION="$(
            ruby -e '
              contents = File.read("lib/renalware.rb")
              match = contents.match(/VERSION\s*=\s*"([^"]+)"/)
              abort("Could not find Renalware::VERSION in lib/renalware.rb") unless match
              puts match[1]
            '
          )"
          SHORT_SHA="${GITHUB_SHA::12}"
          BUILD_TIMESTAMP="$(date -u +'%Y%m%dT%H%M%SZ')"
          SHA_TAG="sha-${SHORT_SHA}"
          VERSION_SHA_TAG="v${VERSION}-sha-${SHORT_SHA}"
          HUMAN_TAG="v${VERSION}-${BUILD_TIMESTAMP}-sha-${SHORT_SHA}"

          {
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "build_timestamp=${BUILD_TIMESTAMP}"
            echo "sha_tag=${SHA_TAG}"
            echo "version_sha_tag=${VERSION_SHA_TAG}"
            echo "human_tag=${HUMAN_TAG}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Candidate tags are not deployment targets. Only promote the scanned digest below.
      - name: Build and push candidate image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            ASSET_CACHE_BUSTER=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE_NAME }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.title=Renalware
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_timestamp }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build Trivy SARIF report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          # Retain unfixed findings for review; the promotion gate blocks fixable findings.
          ignore-unfixed: false
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true

      - name: Upload Trivy SARIF artifact
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          if-no-files-found: error

      - name: Fail on fixable high or critical image vulnerabilities
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Promote scanned image to deployment tags
        if: ${{ success() && steps.scan.outcome == 'success' }}
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
          VERSION_SHA_TAG: ${{ steps.meta.outputs.version_sha_tag }}
          HUMAN_TAG: ${{ steps.meta.outputs.human_tag }}
        run: |
          # Copy the original manifest/index without rebuilding or changing attestations.
          docker buildx imagetools create --prefer-index=false \
            --tag "${IMAGE_NAME}:${SHA_TAG}" \
            --tag "${IMAGE_NAME}:${VERSION_SHA_TAG}" \
            --tag "${IMAGE_NAME}:${HUMAN_TAG}" \
            --tag "${IMAGE_NAME}:main" \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Write image metadata artifact
        shell: bash
        run: |
          cat > canonical-image-metadata.json <<EOF
          {
            "image_name": "${IMAGE_NAME}",
            "version": "${{ steps.meta.outputs.version }}",
            "short_sha": "${{ steps.meta.outputs.short_sha }}",
            "build_timestamp": "${{ steps.meta.outputs.build_timestamp }}",
            "sha_tag": "${{ steps.meta.outputs.sha_tag }}",
            "version_sha_tag": "${{ steps.meta.outputs.version_sha_tag }}",
            "human_tag": "${{ steps.meta.outputs.human_tag }}",
            "digest": "${{ steps.build.outputs.digest }}",
            "source_image": "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          }
          EOF

      - name: Upload image metadata artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: canonical-image-metadata
          path: canonical-image-metadata.json
          if-no-files-found: error

      - name: Summarise published image
        shell: bash
        run: |
          {
            echo "## Canonical image published"
            echo
            echo "- Image: \`${IMAGE_NAME}@${{ steps.build.outputs.digest }}\`"
            echo "- Human tag: \`${{ steps.meta.outputs.human_tag }}\`"
            echo "- Version tag: \`${{ steps.meta.outputs.version_sha_tag }}\`"
            echo "- SHA tag: \`${{ steps.meta.outputs.sha_tag }}\`"
            echo "- Mutable tag: \`main\`"
          } >> "${GITHUB_STEP_SUMMARY}"
